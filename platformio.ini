; WASABI338 TAB5 — fork of zircothc/M5STACK-TAB5-SAMPLER-DRUM-MACHINE-2026
; for the M5Stack Tab5 (ESP32-P4). Board config follows the official Tab5
; PlatformIO guidance (docs.m5stack.com/en/core/Tab5).
;
; Bluetooth is removed for now — it boot-looped the device. The working
; implementation (BLE MIDI peripheral + BLE keyboard HID central) and the
; 16MB partition table it needed are preserved in git at commit ef1e694,
; along with notes on what it took to build: pioarduino 55.03.35 or newer
; (arduino-esp32 3.3.4+ is the first with hosted-BLE support), no
; custom_sdkconfig, and the BLE library on the include path.
[env:m5stack-tab5]
; 55.03.35 = arduino-esp32 3.3.5 + ESP-IDF 5.5.1, the pin the Tab5 community
; recommends: 5.5.2 introduced a MIPI-DSI backlight flicker on this panel.
; If the boot loop persists with Bluetooth gone, this is the next thing to
; try reverting — 54.03.21 (arduino-esp32 3.2.1) is what M5Stack's own Tab5
; PlatformIO docs specify.
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.35
board = esp32-p4-evboard
board_build.mcu = esp32p4
board_build.flash_mode = qio
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -I lib/esp32_usb_host_demos
lib_deps =
    m5stack/M5Unified
    m5stack/M5GFX
