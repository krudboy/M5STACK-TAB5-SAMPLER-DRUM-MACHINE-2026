; WASABI338 TAB5 — fork of zircothc/M5STACK-TAB5-SAMPLER-DRUM-MACHINE-2026
; for the M5Stack Tab5 (ESP32-P4). Board config follows the official Tab5
; PlatformIO guidance (docs.m5stack.com/en/core/Tab5), plus the sdkconfig
; options needed for the experimental hosted-BLE path used by Bluetooth MIDI
; (src/ble_midi.h) — BLE only exists on this board via the onboard ESP32-C6
; co-processor, bridged through Espressif's ESP-Hosted transport.
[env:m5stack-tab5]
; 55.03.35 = arduino-esp32 3.3.5 + ESP-IDF 5.5.1. Needed for Bluetooth: the
; hosted-BLE support (BLE over the onboard ESP32-C6) only exists in
; arduino-esp32 3.3.4 and later — 3.2.1 guards BLEDevice on SOC_BLE_SUPPORTED
; alone, which is false on the radio-less ESP32-P4. IDF 5.5.1 specifically,
; because 5.5.2 introduced a MIPI-DSI backlight flicker on the Tab5 panel.
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.35
board = esp32-p4-evboard
board_build.mcu = esp32p4
board_build.flash_mode = qio
; The board ships 16MB but the default table assumes 4MB and caps the app at
; ~1.28MB, which the BLE stack overflows. See partitions_wasabi338.csv.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_wasabi338.csv
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
; Bluetooth is opt-in. Set to 1 to bring up BLE MIDI + BLE keyboard; if the
; ESP32-C6 handshake fails it can abort() and boot-loop the machine, so it
; stays off until proven on your hardware. Everything else works either way.
    -DWASABI338_ENABLE_BT=0
    -I lib/esp32_usb_host_demos
; The .ino -> .cpp conversion preprocesses before library paths are resolved,
; so the bundled BLE library has to be on the include path explicitly or
; <BLEDevice.h> can't be found and the conversion silently produces nothing.
    -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/BLE/src
; NOTE: do NOT add custom_sdkconfig here for Bluetooth. The stock esp32p4
; libs shipped with arduino-esp32 3.3.5 already enable everything needed —
; CONFIG_ESP_HOSTED_ENABLE_BT_NIMBLE, CONFIG_BT_NIMBLE_ENABLED and both
; NimBLE central and peripheral roles are defined in their sdkconfig.h.
; Setting custom_sdkconfig switches PlatformIO into hybrid mode, which
; rebuilds the IDF from source and regenerates a config where the hosted-BT
; option is dropped (newer esp_hosted renamed it), silently turning Bluetooth
; back off — as well as being far slower to build.
lib_deps =
    m5stack/M5Unified
    m5stack/M5GFX
