; WASABI338 TAB5 — fork of zircothc/M5STACK-TAB5-SAMPLER-DRUM-MACHINE-2026
; for the M5Stack Tab5 (ESP32-P4). Board config follows the official Tab5
; PlatformIO guidance (docs.m5stack.com/en/core/Tab5), plus the sdkconfig
; options needed for the experimental hosted-BLE path used by Bluetooth MIDI
; (src/ble_midi.h) — BLE only exists on this board via the onboard ESP32-C6
; co-processor, bridged through Espressif's ESP-Hosted transport.
[env:m5stack-tab5]
platform = https://github.com/pioarduino/platform-espressif32.git#54.03.21
board = esp32-p4-evboard
board_build.mcu = esp32p4
board_build.flash_mode = qio
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -I lib/esp32_usb_host_demos
; Bluetooth MIDI is currently PARKED — with these commented out, src/ble_midi.h
; compiles to no-op stubs and everything else is unaffected. Uncommenting them
; enables the experimental hosted-BLE path (BLE via the onboard ESP32-C6 over
; ESP-Hosted) and switches PlatformIO into hybrid ESP-IDF compilation, which
; is much slower and builds the whole IDF from source. Verified that these
; exact option names do resolve (CONFIG_ESP_HOSTED_ENABLE_BT_NIMBLE is what
; arduino-esp32 3.2.1's BLEDevice actually checks), but on Windows the hybrid
; build needs a short project path (e.g. C:\w338) or CMake blows past the
; 250-character object path limit.
;custom_sdkconfig =
;    CONFIG_ESP_HOSTED_ENABLED=y
;    CONFIG_ESP_HOSTED_ENABLE_BT_NIMBLE=y
;    CONFIG_BT_ENABLED=y
;    CONFIG_BT_NIMBLE_ENABLED=y
lib_deps =
    m5stack/M5Unified
    m5stack/M5GFX
